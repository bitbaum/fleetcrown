<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="pp-arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M3,1 L9,4 L3,7" fill="none" stroke="var(--status-positive)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="pp-loop" markerWidth="12" markerHeight="12" refX="5" refY="4" orient="auto">
      <path d="M2,1 L8,4 L2,7" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LEFT: PULL -->
  <text x="300" y="66" fill="var(--text-primary)" font-size="20" font-weight="600" text-anchor="middle">Pull</text>
  <text x="300" y="92" fill="var(--text-tertiary)" font-size="13.5" text-anchor="middle">the old way</text>
  <circle cx="300" cy="220" r="46" fill="var(--surface-raised)" stroke="var(--border-default)"/>
  <text x="300" y="228" fill="var(--text-secondary)" font-size="15" text-anchor="middle">a person</text>
  <!-- repeating search loop -->
  <path d="M300,158 A78,78 0 1 1 289,159" fill="none" stroke="var(--text-tertiary)" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="6 7" marker-end="url(#pp-loop)"/>
  <text x="300" y="360" fill="var(--text-secondary)" font-size="15" text-anchor="middle">searches, forgets, repeats</text>
  <text x="300" y="386" fill="var(--text-tertiary)" font-size="13.5" text-anchor="middle">alone — and if nothing turns up, nothing happens</text>

  <!-- divider -->
  <line x1="600" y1="120" x2="600" y2="400" stroke="var(--border-subtle)" stroke-width="1"/>

  <!-- RIGHT: PUSH -->
  <text x="900" y="66" fill="var(--text-primary)" font-size="20" font-weight="600" text-anchor="middle">Push</text>
  <text x="900" y="92" fill="var(--text-tertiary)" font-size="13.5" text-anchor="middle">a remembered need, matched</text>

  <!-- the match node -->
  <rect x="812" y="188" width="176" height="64" rx="13" fill="var(--status-positive)" fill-opacity="0.1" stroke="var(--status-positive)" stroke-opacity="0.5"/>
  <text x="900" y="216" fill="var(--status-positive)" font-size="16" font-weight="600" text-anchor="middle">a match</text>
  <text x="900" y="238" fill="var(--text-secondary)" font-size="12.5" text-anchor="middle">supply meets a standing need</text>

  <!-- two people, both notified -->
  <rect x="690" y="350" width="180" height="58" rx="12" fill="var(--surface-raised)" stroke="var(--border-subtle)"/>
  <text x="780" y="376" fill="var(--text-primary)" font-size="15" text-anchor="middle" font-weight="500">the wisher</text>
  <text x="780" y="396" fill="var(--text-tertiary)" font-size="12.5" text-anchor="middle">"what you wanted exists"</text>
  <rect x="930" y="350" width="180" height="58" rx="12" fill="var(--surface-raised)" stroke="var(--border-subtle)"/>
  <text x="1020" y="376" fill="var(--text-primary)" font-size="15" text-anchor="middle" font-weight="500">the lister</text>
  <text x="1020" y="396" fill="var(--text-tertiary)" font-size="12.5" text-anchor="middle">"someone wants this"</text>

  <path d="M868,256 L790,346" fill="none" stroke="var(--status-positive)" stroke-opacity="0.75" stroke-width="1.6" marker-end="url(#pp-arr)"/>
  <path d="M932,256 L1010,346" fill="none" stroke="var(--status-positive)" stroke-opacity="0.75" stroke-width="1.6" marker-end="url(#pp-arr)"/>

  <text x="600" y="474" fill="var(--text-secondary)" font-size="16.5" text-anchor="middle">Pull makes the demander do all the work. Push finds <tspan fill="var(--text-primary)">both</tspan> people the moment a need meets its match.</text>
</svg>
