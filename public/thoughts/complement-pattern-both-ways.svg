<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="p-arr" markerWidth="12" markerHeight="12" refX="4" refY="4" orient="auto">
      <path d="M4,1 L10,4 L4,7" fill="none" stroke="#8f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="230" y="60" fill="#6e6e6e" font-size="13" letter-spacing="0.16em" text-anchor="middle">TAGGED PRODUCT</text>
  <text x="600" y="60" fill="#6e6e6e" font-size="13" letter-spacing="0.16em" text-anchor="middle">SETTLEMENT</text>
  <text x="970" y="60" fill="#6e6e6e" font-size="13" letter-spacing="0.16em" text-anchor="middle">GRANT</text>

  <!-- ROW 1 — FleetCrown gets paid -->
  <g>
    <rect x="80" y="90" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="104" y="124" fill="#d9a03a" font-size="12.5" letter-spacing="0.12em">FLEETCROWN GETS PAID</text>
    <text x="104" y="162" fill="#ededed" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fleetcrown-plan:pro</text>
    <text x="104" y="192" fill="#7c7c7c" font-size="13.5">a product listed on OrangeCat</text>

    <rect x="450" y="90" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="474" y="150" fill="#ededed" font-size="19" font-weight="500">Bitcoin settles</text>
    <text x="474" y="180" fill="#7c7c7c" font-size="13.5">handlePaymentConfirmed fires</text>

    <rect x="820" y="90" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="844" y="150" fill="#ededed" font-size="19" font-weight="500">Grant the subscription</text>
    <text x="844" y="180" fill="#56b981" font-size="13.5">to FleetCrown, over a signed webhook</text>

    <path d="M380,156 L450,156" fill="none" stroke="#8f8f8f" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#p-arr)"/>
    <path d="M750,156 L820,156" fill="none" stroke="#8f8f8f" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#p-arr)"/>
  </g>

  <!-- ROW 2 — OrangeCat subscribes -->
  <g>
    <rect x="80" y="270" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="104" y="304" fill="#d9a03a" font-size="12.5" letter-spacing="0.12em">ORANGECAT SUBSCRIBES</text>
    <text x="104" y="342" fill="#ededed" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace">supporter-plan</text>
    <text x="104" y="372" fill="#7c7c7c" font-size="13.5">a product listed on OrangeCat</text>

    <rect x="450" y="270" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="474" y="330" fill="#ededed" font-size="19" font-weight="500">Bitcoin settles</text>
    <text x="474" y="360" fill="#7c7c7c" font-size="13.5">the very same settlement hook</text>

    <rect x="820" y="270" width="300" height="132" rx="13" fill="#181818" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="844" y="330" fill="#ededed" font-size="19" font-weight="500">Grant the plan</text>
    <text x="844" y="360" fill="#56b981" font-size="13.5">to OrangeCat, in a local table</text>

    <path d="M380,336 L450,336" fill="none" stroke="#8f8f8f" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#p-arr)"/>
    <path d="M750,336 L820,336" fill="none" stroke="#8f8f8f" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#p-arr)"/>
  </g>

  <!-- caption -->
  <text x="600" y="474" fill="#8a8a8a" font-size="16.5" text-anchor="middle">One pattern — <tspan fill="#cfcfcf">tag → settlement → grant</tspan> — reflected in a mirror. The only difference is where the grant lands.</text>
</svg>
