<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah-l" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M8,1 L2,4 L8,7" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-r" markerWidth="12" markerHeight="12" refX="4" refY="4" orient="auto">
      <path d="M4,1 L10,4 L4,7" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LEFT CARD — FleetCrown -->
  <rect x="60" y="60" width="470" height="410" rx="18" fill="var(--surface-base)" stroke="var(--border-default)"/>
  <text x="92" y="112" fill="var(--text-primary)" font-size="27" font-weight="600">FleetCrown</text>
  <text x="92" y="140" fill="var(--text-tertiary)" font-size="13.5" letter-spacing="0.14em">CAPABILITY LAYER</text>

  <!-- FC row A: Metering — lacks -->
  <rect x="92" y="180" width="406" height="94" rx="12" fill="none" stroke="var(--status-negative)" stroke-opacity="0.55" stroke-dasharray="6 6"/>
  <text x="120" y="222" fill="var(--text-primary)" font-size="20" font-weight="500">Metering</text>
  <text x="120" y="250" fill="var(--text-tertiary)" font-size="14">no usage, no wallet, no ledger</text>
  <g transform="translate(452,214)">
    <circle r="15" fill="var(--status-negative)" fill-opacity="0.14"/>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="var(--status-negative)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- FC row B: Recurring pricing — has -->
  <rect x="92" y="300" width="406" height="94" rx="12" fill="var(--surface-raised)" stroke="var(--border-subtle)"/>
  <text x="120" y="342" fill="var(--text-primary)" font-size="20" font-weight="500">Recurring pricing</text>
  <text x="120" y="370" fill="var(--text-tertiary)" font-size="14">tiers, subscriptions, expiry</text>
  <g transform="translate(452,334)">
    <circle r="15" fill="var(--status-positive)" fill-opacity="0.16"/>
    <path d="M-6,0 L-2,5 L6,-5" fill="none" stroke="var(--status-positive)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT CARD — OrangeCat -->
  <rect x="670" y="60" width="470" height="410" rx="18" fill="var(--surface-base)" stroke="var(--border-default)"/>
  <text x="702" y="112" fill="var(--text-primary)" font-size="27" font-weight="600">OrangeCat</text>
  <text x="702" y="140" fill="var(--text-tertiary)" font-size="13.5" letter-spacing="0.14em">ECONOMY LAYER</text>

  <!-- OC row A: Metering — has -->
  <rect x="702" y="180" width="406" height="94" rx="12" fill="var(--surface-raised)" stroke="var(--border-subtle)"/>
  <text x="730" y="222" fill="var(--text-primary)" font-size="20" font-weight="500">Metering</text>
  <text x="730" y="250" fill="var(--text-tertiary)" font-size="14">wallet, settlement, priced ledger</text>
  <g transform="translate(1062,214)">
    <circle r="15" fill="var(--status-positive)" fill-opacity="0.16"/>
    <path d="M-6,0 L-2,5 L6,-5" fill="none" stroke="var(--status-positive)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- OC row B: Recurring product — lacks -->
  <rect x="702" y="300" width="406" height="94" rx="12" fill="none" stroke="var(--status-negative)" stroke-opacity="0.55" stroke-dasharray="6 6"/>
  <text x="730" y="342" fill="var(--text-primary)" font-size="20" font-weight="500">Recurring product</text>
  <text x="730" y="370" fill="var(--text-tertiary)" font-size="14">no subscription, no checkout</text>
  <g transform="translate(1062,334)">
    <circle r="15" fill="var(--status-negative)" fill-opacity="0.14"/>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="var(--status-negative)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- CONNECTORS: each strength fills the other's gap -->
  <path d="M666,227 L534,227" fill="none" stroke="var(--text-secondary)" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah-l)"/>
  <path d="M534,347 L666,347" fill="none" stroke="var(--text-secondary)" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah-r)"/>

  <!-- caption -->
  <text x="600" y="516" fill="var(--text-secondary)" font-size="16.5" text-anchor="middle">Each <tspan fill="var(--status-negative)">✕</tspan> is the other's <tspan fill="var(--status-positive)">✓</tspan> — the halves were cut from the same picture.</text>
</svg>
