<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="fb-arr" markerWidth="12" markerHeight="12" refX="6" refY="4" orient="auto">
      <path d="M2,1 L9,4 L2,7" fill="none" stroke="var(--text-tertiary)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fb-arr-pos" markerWidth="12" markerHeight="12" refX="6" refY="4" orient="auto">
      <path d="M2,1 L9,4 L2,7" fill="none" stroke="var(--status-positive)" stroke-opacity="0.85" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- top row: visitor → widget → inbox -->
  <g font-size="14.5" font-weight="500">
    <rect x="70" y="60" width="210" height="56" rx="12" fill="var(--surface-raised)" stroke="var(--border-default)"/>
    <text x="175" y="84" fill="var(--text-primary)" text-anchor="middle">A visitor on your site</text>
    <text x="175" y="103" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">sees something broken</text>

    <rect x="450" y="60" width="300" height="56" rx="12" fill="var(--surface-raised)" stroke="var(--border-default)"/>
    <text x="600" y="84" fill="var(--text-primary)" text-anchor="middle">Feedback widget</text>
    <text x="600" y="103" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">one script tag · points at the exact element</text>

    <rect x="910" y="60" width="220" height="56" rx="12" fill="var(--surface-raised)" stroke="var(--border-default)"/>
    <text x="1020" y="84" fill="var(--text-primary)" text-anchor="middle">Project inbox</text>
    <text x="1020" y="103" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">every report, per project</text>
  </g>

  <!-- the human gate (highlighted) -->
  <g font-size="14.5" font-weight="600">
    <rect x="880" y="282" width="280" height="56" rx="12" fill="var(--accent-primary)" fill-opacity="0.08" stroke="var(--accent-primary)" stroke-opacity="0.6"/>
    <text x="1020" y="306" fill="var(--accent-primary)" text-anchor="middle">You approve — one click</text>
    <text x="1020" y="325" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">the only gate before an agent acts</text>
  </g>

  <!-- three routes into the gate -->
  <g font-size="12.5" fill="var(--text-secondary)">
    <text x="855" y="180" text-anchor="end">Dispatch fix — with an optional instruction</text>
    <text x="855" y="207" text-anchor="end">Synthesize — an agent clusters noise into briefs</text>
    <text x="855" y="234" text-anchor="end">Daily digest — drafts land on /approvals</text>
  </g>

  <!-- bottom row: agent run → fix live → loop closed -->
  <g font-size="14.5" font-weight="500">
    <rect x="880" y="486" width="280" height="56" rx="12" fill="var(--surface-raised)" stroke="var(--border-default)"/>
    <text x="1020" y="510" fill="var(--text-primary)" text-anchor="middle">Agent fixes it in your repo</text>
    <text x="1020" y="529" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">branch → PR → deploy</text>

    <rect x="460" y="486" width="280" height="56" rx="12" fill="var(--surface-raised)" stroke="var(--border-default)"/>
    <text x="600" y="510" fill="var(--text-primary)" text-anchor="middle">Fix live on your site</text>
    <text x="600" y="529" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">run reports success, with evidence</text>

    <rect x="70" y="486" width="250" height="56" rx="12" fill="var(--status-positive)" fill-opacity="0.1" stroke="var(--status-positive)" stroke-opacity="0.5"/>
    <text x="195" y="510" fill="var(--status-positive)" text-anchor="middle">Resolved — automatically</text>
    <text x="195" y="529" fill="var(--text-tertiary)" font-size="12" font-weight="400" text-anchor="middle">"your feedback shipped" email goes out</text>
  </g>

  <!-- flow arrows -->
  <g fill="none" stroke="var(--text-tertiary)" stroke-width="1.6" stroke-opacity="0.7">
    <path d="M285,88 L442,88" marker-end="url(#fb-arr)"/>
    <path d="M755,88 L902,88" marker-end="url(#fb-arr)"/>
    <path d="M1020,121 L1020,274" marker-end="url(#fb-arr)"/>
    <path d="M1020,343 L1020,478" marker-end="url(#fb-arr)"/>
    <path d="M875,514 L748,514" marker-end="url(#fb-arr)"/>
    <path d="M455,514 L328,514" marker-end="url(#fb-arr)"/>
  </g>

  <!-- closing arc: resolved → back to the visitor -->
  <g fill="none" stroke="var(--status-positive)" stroke-opacity="0.6" stroke-width="1.8">
    <path d="M195,481 C195,340 175,260 175,124" marker-end="url(#fb-arr-pos)"/>
  </g>
  <text x="148" y="300" fill="var(--status-positive)" font-size="12.5" text-anchor="middle" transform="rotate(-90 148,300)" opacity="0.9">the loop closes</text>

  <!-- gate → agent label -->
  <text x="1005" y="415" fill="var(--text-tertiary)" font-size="12" text-anchor="end">the exact prompt you reviewed</text>
</svg>
