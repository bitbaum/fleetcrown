<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- FleetCrown brand mark (spiral) — must stay visually identical to the SVG in BrandMark.tsx -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <g transform="translate(116 116) scale(11.6667)" fill="none" stroke="#ededed" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner half of the spiral (brighter): r=2 → r=4 -->
    <path d="M 12 14 A 2 2 0 0 1 12 10 A 4 4 0 0 0 12 16" stroke="#ededed" stroke-width="1.6" opacity="0.95"/>
    <!-- outer half of the spiral (softer): r=6 -->
    <path d="M 12 16 A 6 6 0 0 1 12 6" stroke="#ededed" stroke-width="1.6" opacity="0.7"/>
  </g>
</svg>
