# pnpm 11 refuses to run a dependency's build script unless it is approved here,
# and it EXITS NON-ZERO when one is unapproved — so without this file a fresh
# scaffold cannot install at all, the deploy dies before it reaches the build,
# and the brand-new site serves 502 from a fully provisioned host.
#
# Both of these need their build step:
#   sharp          native image codec; next uses it for image optimisation
#   unrs-resolver  native module resolver used by eslint-config-next
#
# This lives here and NOT in package.json's "pnpm" field: pnpm 11 no longer
# reads that field and ignores it with a warning, which makes the setting look
# present while doing nothing — a checker grepping for the key would pass.
#
# Diplodoctor hit exactly this on 2026-09-10 and fixed it in its own repository.
# The template is where it belongs, so the next site does not rediscover it.
allowBuilds:
  sharp: true
  unrs-resolver: true
