# SSOT manifest for self-hosted apps on bitbaum (167.233.22.31).
#
# Format:
#   name|port|domains|repo_path|app_dir|db|owner|kind|status|plan|price|since
#
#   name..db   provisioning — what sync-infra.sh and deploy.sh read (unchanged)
#   db         host Postgres database name, OR `supabase:<schema>` for an app
#              living in the supabase-db container, OR '-' for no database.
#              One supabase database backs several apps, so each gets its OWN
#              schema: `public` belongs to orangecat, and a second app's
#              migrations landing there would collide with it by table AND by
#              function name. '-' skips the schema step entirely — which is
#              how botsmann ran for months against 11 migrations nobody had
#              applied, serving 503 from a table that did not exist.
#   owner      who this belongs to. 'bitbaum' = ours. Otherwise the client.
#   kind       product | client-app | client-site | demo | infra | library
#   status     live | prospect | validating | demo | unverified | handed-over | archived
#   plan/price what they pay, and how much. '-' means NOT KNOWN — and the gaps
#              are the point: right now "what am I owed this month" and "what am
#              I maintaining for free" are unanswerable, which is why these
#              columns exist before the numbers do.
#   since      when the relationship started (ISO date), '-' if unrecorded.
#
# One register, not four. bitbaum/projects/*.md holds the narrative; this holds
# the facts, because this is the file that provisioning reads and therefore the
# only one nobody can afford to let go stale.
#
# domains "-" = internal only. Ports 4001-4004 are the pre-existing handcrafted
# services (bridge, fleetcrown, orangecat, revampit) — they keep their own units
# and Caddy blocks and are NOT listed here.
