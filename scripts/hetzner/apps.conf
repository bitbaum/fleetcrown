# AOZ Begleitung — the product name (SSOT: aoz-housing src/lib/config/brand.ts).
# `aoz-wohnen` here, the systemd unit, /opt/aoz-wohnen and the aoz_wohnen
# database keep the housing-era name on purpose: they are addresses nobody
# reads, and renaming them is a migration, not a correction. The REPO is
# bitbaum/aoz-housing — a third name. Do not infer the product from any of them.
#
# The canonical public host is aoz.orangecat.ch, and until 2026-09-10 this row
# said aoz-wohnen.orangecat.ch — which is only a 301 to it. That was not a
# cosmetic error: sync-infra.sh rewrites /etc/caddy/apps.d/<name>.caddy from
# this field with an unconditional `tee`, so the next sync would have deleted
# the aoz.orangecat.ch site block outright and taken the client's real URL off
# the air. The register has to name the host that actually serves.
#
# aoz-wohnen.orangecat.ch is still redirected on the box (it is printed on paper
# and bookmarked by residents). That redirect currently lives INSIDE the
# generated file, so a sync still drops it — it belongs in its own
# aoz-legacy-redirect.caddy, the way sink-legacy-redirect.caddy already does it.
