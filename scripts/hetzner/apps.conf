# hirnli.orangecat.ch is the SAME app (one codebase, one deploy — the middleware
# reads the Host header to pick the tenant chrome), but it is NOT listed here:
# it is served by a hand-maintained /etc/caddy/apps.d/hirnli.caddy. Listing it
# would make sync-infra emit it a second time inside revamp-info.caddy, and two
# site blocks for one address fails `caddy validate` — which sync-infra runs
# immediately before `systemctl reload`, so the reload aborts and every OTHER
