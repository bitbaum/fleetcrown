#cloud-config
# Oracle Always Free — Ubuntu 22.04/24.04 ARM (VM.Standard.A1.Flex)
# Paste into: Instance → "Cloud-init script" when creating the VM.
# Replace __SSH_PUBLIC_KEY__ with output from: scripts/db/oracle-bootstrap.sh

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw

ssh_authorized_keys:
  - __SSH_PUBLIC_KEY__

users:
  - default
  - name: ubuntu
    groups: docker
    sudo: ALL=(ALL) NOPASSWD:ALL

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - ufw allow 22/tcp
  - ufw allow 5432/tcp
  - ufw allow 6432/tcp
  - ufw --force enable

final_message: "Cockpit Postgres host ready. Run oracle-cutover.sh from your laptop."
