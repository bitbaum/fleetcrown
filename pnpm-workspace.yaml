# packages/agent replaces the npm "workspaces" field; bridge/ (its own npm
# package with its own lockfile under npm) joins the workspace so the whole
# repo installs with ONE pnpm install and one lockfile.
packages:
  - packages/*
  - bridge

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL.
  # If the listkit pin moves, update this sha — pnpm prints the new key in its
  # ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED message. (Same shape evig uses for
  # ai-forms; it goes away if listkit is ever published to npm, because a
  # published tarball ships dist/ and needs no build here.)
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true

# Security pin. This lived in package.json "overrides", which pnpm silently
# IGNORES (npm-only field) — it must live here to keep applying.
overrides:
  # Transitive high advisories the daily Audit refuses (2026-09-07 → ): Sentry
  # build tooling and shadcn's config loader; neither reachable at runtime.
  # Drop each line once the parent ships a fixed range.
  "browserslist@<=4.28.6": ">=4.28.7"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2"
  fast-uri: ^3.1.6

# pnpm refuses packages published within its minimum-release-age window — a
# supply-chain guard against a compromised release being installed before
# anyone notices. @bitbaum/ai-kit 0.6.2 is our own package, published to npm
# the day before this commit, so it needs an explicit exemption.
#
# Temporary: once 0.6.2 is older than the window this entry is redundant and
# should be deleted. Add lines only for versions we published ourselves —
# never to hurry along a third-party package.
minimumReleaseAgeExclude:
  - "@bitbaum/ai-kit@0.6.2"
  - "@bitbaum/mail-kit"
  - "bip-kit"
  - "limitkit"
