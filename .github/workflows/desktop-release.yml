# Fleet Runner desktop release — multi-platform build + GitHub Release.
#
# Trigger: pushing a tag matching `fleet-runner-v*` (e.g. fleet-runner-v0.2.0).
# Output: installers for macOS (.dmg, .zip), Windows (NSIS .exe), and
# Linux (.AppImage, .deb), uploaded as assets on a DRAFT GitHub release on
# this repo (maonakamoto/fleetcrown) with electron-builder's default tag
# `v<version>` (no `fleet-runner-` prefix — that's an electron-builder
# limitation, it derives the tag from package.json version).
#
# The canonical public download host is maonakamoto/fleetcrown-releases
# (matching the existing fleet-runner-v* tag convention), which is where the
# marketing /download page's /releases/latest/... URLs resolve. After this
# workflow turns green, run scripts/mirror-desktop-release.sh <version> from
# any machine with `gh` logged in to mirror the draft → public release with
# the correct tag. That step will go away once a cross-repo PAT secret is
# wired in (TODO: `RELEASES_REPO_TOKEN` with repo scope on fleetcrown-
# releases, then swap GITHUB_TOKEN below for it).
#
# Why this exists: macOS and Windows users could not download Fleet Runner
# before — there was only a Linux AppImage produced manually. electron-builder
# needs to run on the target OS for signed installers, so this workflow uses a
# build matrix to produce all three from one tag push.
#
# Manual run via `workflow_dispatch` is also supported for testing changes to
# the build pipeline without minting a real version tag.

name: Desktop release

on:
  push:
    tags:
      - 'fleet-runner-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — do not publish to a GitHub Release'
        type: boolean
        default: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# electron-builder's GitHub provider uploads artifacts to releases, which
# requires the workflow token to have write access to the repo's contents.
# The default GITHUB_TOKEN permissions are read-only on contents under the
# new GitHub permissions model.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist_script: dist:mac
            artifact_glob: |
              desktop/dist/Fleet-Runner-mac-*.dmg
              desktop/dist/Fleet-Runner-mac-*.zip
              desktop/dist/latest-mac.yml
          # windows-2022 (not -latest): node-pty is rebuilt from source by
          # @electron/rebuild's node-gyp 9, which can't detect the VS the
          # newer images ship. The image rotated under us after v0.8.0 and
          # every release build since died at "Install desktop deps".
          - os: windows-2022
            dist_script: dist:win
            artifact_glob: |
              desktop/dist/Fleet-Runner-win-*.exe
              desktop/dist/latest.yml
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_glob: |
              desktop/dist/Fleet-Runner-linux-*.AppImage
              desktop/dist/Fleet-Runner-linux-*.deb
              desktop/dist/latest-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # node-gyp 9 (via @electron/rebuild) needs Python with distutils —
      # removed in Python 3.12, which macos/ubuntu images now default to.
      # Pin 3.11 so the proven dep set keeps building from source.
      - name: Setup Python 3.11 (node-gyp needs distutils)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Top-level install — the web app's package.json is needed so
      # @home/* + @/* imports in the desktop main process resolve (those
      # aliases reach into ../src and ../home).
      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # electron-builder is happy to talk to GH Releases via the standard
      # GITHUB_TOKEN. For tag pushes we publish; for dry-run (workflow_dispatch)
      # we only build so we can sanity-check the matrix without making a Release.
      - name: Build & package
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish only on a real tag — on workflow_dispatch we leave artifacts
          # in dist/ for the upload-artifact step to grab.
          PUBLISH_FOR_RELEASE: ${{ startsWith(github.ref, 'refs/tags/fleet-runner-v') && !inputs.dry_run }}
          # ── Code-signing (gated: empty when the secret is unset → unsigned build,
          # exactly as today). electron-builder reads these directly: set CSC_LINK
          # (base64 Developer ID .p12) + CSC_KEY_PASSWORD to sign macOS; WIN_CSC_LINK
          # + WIN_CSC_KEY_PASSWORD for Windows. Notarization also needs the mac.notarize
          # config + entitlements — see docs/development/desktop-signing.md.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "$PUBLISH_FOR_RELEASE" = "true" ]; then
            # `--publish always` is what tells electron-builder to upload to GH.
            # We replace the dist:<os> script's "--publish=never" with always
            # for this run only.
            npx electron-vite build
            case "${{ matrix.os }}" in
              macos-latest)    npx electron-builder --mac    --publish always ;;
              windows-2022)    npx electron-builder --win    --publish always ;;
              ubuntu-latest)   npx electron-builder --linux  --publish always ;;
            esac
          else
            npm run ${{ matrix.dist_script }}
          fi

      # Always upload the built binaries as workflow artifacts — useful when
      # running via workflow_dispatch (no GH Release will exist) and as a
      # backup for the tagged release path.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fleet-runner-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
          retention-days: 14
