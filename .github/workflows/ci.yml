name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch — saves
# minutes when commits land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Design system guard
        run: npm run check:design

      - name: Control presenter tests
        run: npm run test:control-presenter

      - name: Local orchestration tests
        run: npm run test:home

      - name: URL resolution tests
        run: npm run test:db-url

      - name: Orchestration summary tests
        run: npm run test:orchestration-summary

      # `next build` is intentionally NOT here — the App-Router pages do
      # DB queries during static pre-render, so a real Postgres would
      # need to be set up + migrated + seeded before the build can run.
      # Vercel does that on deploy, so this CI focuses on type/lint and
      # leaves build verification to Vercel.
